// Project dependencies. Versions live in gradle/libs.versions.toml.
dependencies {
    // Spring Boot BOM as a platform: it manages the versions of every Spring Boot dependency.
    implementation platform(libs.spring.boot.bom)
    implementation libs.spring.boot.autoconfigure

    implementation libs.lib.errors
    compileOnly libs.spring.web
    compileOnly libs.spring.webmvc
    compileOnly libs.jakarta.servlet.api
    compileOnly libs.spring.boot.restclient

    // api '...'            // dependencies exposed to consumers
    // implementation '...' // internal dependencies

    testImplementation platform(libs.spring.boot.bom)
    testImplementation libs.spring.boot.starter.test
    testImplementation libs.junit.jupiter
    testImplementation libs.spring.boot.starter.webmvc
    testImplementation libs.spring.boot.starter.restclient
    testImplementation libs.lib.errors
    testRuntimeOnly libs.junit.platform.launcher

    intTestImplementation platform(libs.spring.boot.bom)
    intTestImplementation libs.spring.boot.autoconfigure
    intTestImplementation libs.spring.boot.starter.test
    intTestImplementation libs.junit.jupiter
    intTestImplementation libs.spring.boot.starter.webmvc
    intTestImplementation libs.spring.boot.starter.restclient
    intTestImplementation libs.lib.errors
    intTestRuntimeOnly libs.junit.platform.launcher

    archTestImplementation platform(libs.spring.boot.bom)
    archTestImplementation libs.junit.jupiter
    archTestImplementation libs.archunit.junit5
    archTestRuntimeOnly libs.junit.platform.launcher
}
